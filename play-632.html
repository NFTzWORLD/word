    #machine {
      position:absolute; inset:0; z-index:1;
      display:flex; flex-direction:column;
      padding:9.2% 15.2% 8%;
      box-sizing:border-box;
    }
    #crest { display:block; width:8.2%; height:auto; margin:0 auto .35%; filter:drop-shadow(0 0 14px rgba(255,210,74,.7)) drop-shadow(0 2px 8px #000); }
    .tag {
      text-align:center; color:#ffd24a; font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(8px,1.3vw,12px); letter-spacing:.28em; margin:0 0 1.1%;
      text-shadow:0 0 12px rgba(255,210,74,.65);
    }
    .bank { flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; gap:1.5%; }
    .place {
      display:grid; grid-template-columns:repeat(8,1fr);
      text-align:center; color:#ffd24a;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(9px,1.5vw,13px); font-weight:700;
      letter-spacing:.02em; text-shadow:0 2px 0 #000, 0 0 10px rgba(255,210,74,.45);
    }
    .place span.off { color:#8a7038; text-shadow:none; }
    .row {
      display:grid; grid-template-columns:repeat(8,1fr);
      gap:0.8%; flex:1; align-items:center;
    }
    .cell {
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; height:100%;
    }
    .cell img {
      width:62%; height:auto; display:block; pointer-events:none;
      transition:transform .08s ease-out;
    }
    .cell img.sq { width:52%; }
    .cell img.btn { width:40%; }
    .cell:active img { transform:scale(.82); }
    .cell.bang img { animation:bang .16s ease-out; }
    .cell.on img.sq { animation:pulse 1.35s ease-in-out infinite; }
    .cell.on img.btn { animation:glow 1.1s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { filter:drop-shadow(0 0 6px rgba(204,255,0,.55)) brightness(1); }
      50% { filter:drop-shadow(0 0 22px rgba(204,255,0,1)) brightness(1.22); }
    }
    @keyframes glow {
      0%,100% { filter:drop-shadow(0 0 6px rgba(0,255,80,.55)) brightness(1); }
      50% { filter:drop-shadow(0 0 18px rgba(0,255,90,1)) brightness(1.28); }
    }
    @keyframes bang {
      0% { transform:scale(1.22); filter:brightness(1.55) drop-shadow(0 0 18px #ccff00); }
      100% { transform:scale(1); }
    }
    #read {
      background:rgba(0,0,0,.78);
      border:1px solid #1a1a1a;
      padding:1.1% 2.4%;
      font-family:ui-monospace,Menlo,Consolas,monospace;
    }
    .line { display:flex; justify-content:space-between; align-items:baseline; padding:.04em 0; }
    .lab { color:#8a9a58; font-size:clamp(9px,1.5vw,13px); letter-spacing:.18em; text-transform:uppercase; }
    .val { font-size:clamp(15px,2.8vw,26px); letter-spacing:.06em; }
    #bin { color:#ccff00; text-shadow:0 0 8px rgba(204,255,0,.45); }
    #dec { color:#ffb000; }
    #hex { color:#ff2ea6; }
    #hit {
      position:absolute; inset:0; background:#ffd24a; opacity:0;
      pointer-events:none; z-index:5; mix-blend-mode:screen;
    }
    body.hit #hit { animation:hitflash .11s linear; }
    @keyframes hitflash { 0% { opacity:.32; } 100% { opacity:0; } }
    #bite {
      position:absolute; inset:0; z-index:6; overflow:hidden; pointer-events:none;
      opacity:0;
    }
    body.boom #bite, body.pin #pinbite { opacity:1; animation: punch .5s cubic-bezier(.15,1.6,.3,1); }
    #pinbite {
      position:absolute; inset:0; z-index:6; overflow:hidden; pointer-events:none;
      opacity:0;
    }
    #pinart {
      position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
      display:block; filter:drop-shadow(0 0 28px rgba(204,255,0,.75));
    }
    body.pin #machine { animation: shake .4s linear; }
    body.pin #flash { animation: flash .22s linear; }
    #maw {
      position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
      display:block; filter:drop-shadow(0 0 28px rgba(204,255,0,.75));
    }
    body.boom #machine { animation: shake .4s linear; }
    #flash {
      position:absolute; inset:0; background:#ffd24a; opacity:0;
      pointer-events:none; z-index:7; mix-blend-mode:screen;
    }
    body.boom #flash { animation: flash .22s linear; }
    @keyframes punch {
      0% { transform: scale(0.42); opacity:0; }
      55% { transform: scale(1.12); opacity:1; }
      100% { transform: scale(1); opacity:1; }
    }
    @keyframes flash { 0% { opacity:.8; } 100% { opacity:0; } }
    @keyframes shake {
      0%,100% { transform: translate(0,0); }
      20% { transform: translate(-1.4%, .8%); }
      40% { transform: translate(1.6%, -.6%); }
      60% { transform: translate(-1.1%, -.5%); }
      80% { transform: translate(.9%, .7%); }
    }
  </style>
</head>

    var click = document.getElementById("click");
    var sting = document.getElementById("sting");
    var CODE = [8,8,15,15,9,14,9,14,11,12];
    var seq = [];
    var lastHit = 0;
    var busy = false;
    var pinArmed = true;

    function snap() {
      try { click.currentTime = 0; click.volume = 1; click.play().catch(function(){}); } catch (e) {}
    }
    function value() {
      var n = 0;
      for (var i = 0; i < 16; i++) if (bits[i]) n |= W[i];
      return n;
    }
    function paint() {
      var n = value();
      var b = n.toString(2).padStart(16,"0");
      document.getElementById("bin").textContent = b.slice(0,8) + "  " + b.slice(8);
      document.getElementById("dec").textContent = String(n);
      document.getElementById("hex").textContent = "0x" + n.toString(16).toUpperCase().padStart(4,"0");
      for (var i = 0; i < 16; i++) {
        var on = bits[i] === 1;
        var s = document.getElementById("s"+i);
        var t = document.getElementById("b"+i);
        var p = document.getElementById("p"+i);
        s.classList.toggle("on", on);
        t.classList.toggle("on", on);
        p.classList.toggle("off", !on);
        s.querySelector("img").src = on ? sqOn : sqOff;
        t.querySelector("img").src = on ? btnGreen : btnRed;
      }
      if (n === 0xCC00 && pinArmed && !busy) {
        pinArmed = false;
        pinBite();
      }
      if (n !== 0xCC00) pinArmed = true;
    }
    function punch(i) {
      ["s"+i, "b"+i].forEach(function (id) {
        var el = document.getElementById(id);
        el.classList.remove("bang");
        void el.offsetWidth;
        el.classList.add("bang");
      });
      document.body.classList.remove("hit");
      void document.body.offsetWidth;
      document.body.classList.add("hit");
      setTimeout(function () { document.body.classList.remove("hit"); }, 120);
    }
    function bite() {
      pop("boom");
    }
    function pinBite() {
      pop("pin");
    }
    function pop(kind) {
      if (busy) return;
      busy = true;
      try { sting.currentTime = 0; sting.volume = 1; sting.play().catch(function () {}); } catch (e) {}
      document.body.classList.add(kind);
      setTimeout(function () {
        document.body.classList.remove(kind);
        busy = false;
      }, 1600);
    }
    function cheat(i) {
      var now = Date.now();
      if (now - lastHit > 2200) seq = [];
      lastHit = now;
      var next = CODE[seq.length];
      if (i === next) {
        seq.push(i);
        if (seq.length === CODE.length) {
          seq = [];
          bite();
        }
      } else {
        seq = (i === CODE[0]) ? [i] : [];
      }
    }
    function toggle(i) {
      bits[i] = bits[i] ? 0 : 1;
      snap();
      punch(i);
      paint();
      cheat(i);
    }
    function cell(id, kind) {
      var el = document.createElement("div");
      el.className = "cell";
      el.id = id;
      var img = document.createElement("img");
      img.className = kind;
      img.alt = "";
      el.appendChild(img);
      return el;
    }
    var placeH = document.getElementById("placeH");
    var placeL = document.getElementById("placeL");
    var sqH = document.getElementById("sqH");
    var sqL = document.getElementById("sqL");
    var btH = document.getElementById("btH");
    var btL = document.getElementById("btL");
    for (var i = 0; i < 16; i++) {
      (function (i) {
        var lab = document.createElement("span");
        lab.id = "p"+i;
        lab.textContent = String(W[i]);
        var s = cell("s"+i, "sq");
        var t = cell("b"+i, "btn");
        s.addEventListener("click", function(){ toggle(i); });
        t.addEventListener("click", function(){ toggle(i); });
        s.addEventListener("touchstart", function(ev){ ev.preventDefault(); toggle(i); }, {passive:false});
        t.addEventListener("touchstart", function(ev){ ev.preventDefault(); toggle(i); }, {passive:false});
        if (i < 8) { placeH.appendChild(lab); sqH.appendChild(s); btH.appendChild(t); }
        else { placeL.appendChild(lab); sqL.appendChild(s); btL.appendChild(t); }
      })(i);
    }
    for (var i = 0; i < 16; i++) bits[i] = (start & W[i]) ? 1 : 0;
    paint();
    if (/\bboom\b/.test(location.search + location.hash)) bite();
    if (/\bpin\b/.test(location.search + location.hash)) pinBite();
  })();
